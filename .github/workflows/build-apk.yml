name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # 1.25: golang.org/x/mobile@latest requires Go >= 1.25, so pin 1.25 to
          # avoid the per-build toolchain auto-download. go.mod stays at `go 1.22`
          # (x/crypto v0.31.0 is compatible with both), so the AAR still builds.
          go-version: '1.25'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Run Go tests
        run: |
          cd go
          go test ./...

      - name: Build yami.aar (Go core -> Android AAR)
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
        run: |
          cd go
          # golang.org/x/mobile must be in the module dependency graph for
          # `gomobile bind` to resolve it. Do NOT `go mod tidy` — tidy removes
          # x/mobile because no .go file imports it (it is only a build tool),
          # which surfaces as "not in the module dependency graph".
          go get golang.org/x/mobile@latest
          # The bind output dir must exist, or gomobile errors with
          # "open ../android/app/libs/yami.aar: no such file or directory".
          mkdir -p ../android/app/libs
          gomobile bind -target=android -androidapi 24 -o ../android/app/libs/yami.aar ./yami

      - name: Set up Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          mkdir -p /opt/gradle
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"

      # The release build is signed with the Android debug keystore so the
      # uploaded APK is always installable without manual keystore setup.
      - name: Generate debug keystore for signing
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=ZedScope Debug,O=ZedScope,C=US"

      - name: Build release APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          cd android
          gradle assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZedScope-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Publish the built APK to a stable, public GitHub Release so it can be
      # downloaded directly (release assets are served from GitHub's CDN, which
      # is reachable even from restricted networks). The `latest` tag is
      # overwritten on every successful build.
      - name: Publish APK to GitHub Release (stable download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ZedScope latest build
          files: android/app/build/outputs/apk/release/*.apk
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
