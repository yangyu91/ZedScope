<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>ZedScope</title>
<!-- 设计 token 与原生 res/values 保持一致，见 ui-tokens.css 头注释 -->
<link rel="stylesheet" href="ui-tokens.css">
<style>
  /* 起始页专属排版：浏览为主 → 搜索框与「网络日志」是视觉重心 */
  .head { display:flex; align-items:flex-start; justify-content:space-between; gap:var(--s-md) }
  .status { display:flex; flex-wrap:wrap; gap:6px; margin:var(--s-sm) 0 var(--s-lg) }

  form.omni { display:flex; gap:var(--s-sm); margin-bottom:var(--s-md) }
  form.omni input {
    flex:1 1 auto; border-radius:var(--r-md); padding:13px var(--s-lg);
    background:var(--surface-2);
  }
  form.omni button {
    flex:0 0 auto; width:52px; padding:0; height:46px;
    display:flex; align-items:center; justify-content:center;
    border:0; border-radius:var(--r-md);
    background:var(--accent); color:var(--on-accent);
    transition:transform var(--dur-fast) var(--ease);
  }
  form.omni button:active { transform:scale(.94) }

  /* 主行动：一键看网络日志（借鉴嗅觉浏览器「浏览 + 网络日志」双主线） */
  a.primary {
    display:flex; align-items:center; gap:var(--s-md);
    background:var(--surface);
    border:1px solid var(--line); border-radius:var(--r-lg);
    padding:var(--s-lg); text-decoration:none; color:var(--on);
    transition:transform var(--dur-fast) var(--ease), border-color var(--dur) var(--ease), background var(--dur) var(--ease);
  }
  a.primary:active { transform:scale(.985) }
  a.primary .ico {
    width:42px; height:42px; flex:0 0 auto; border-radius:var(--r-md);
    background:var(--accent); color:var(--on-accent);
    display:flex; align-items:center; justify-content:center;
  }
  a.primary .t { font-size:15px; font-weight:600 }
  a.primary .d { font-size:11.5px; color:var(--dim); margin-top:2px }
  a.primary .go { color:var(--accent); font-size:18px; flex:0 0 auto }
  /* AI 对话入口：用实色强调，区别于网络日志的柔和卡 */
  a.primary.ai { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  a.primary.ai .ico { background:var(--on-accent); color:var(--accent); }
  a.primary.ai .d { color:rgba(4, 36, 15, .72); }
  a.primary.ai .go { color:var(--on-accent); }

  .grid { display:grid; gap:var(--s-md); grid-template-columns:repeat(var(--cols,2), minmax(0,1fr)) }
  a.site {
    display:block; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--r-lg); padding:var(--s-lg); color:var(--on);
    text-decoration:none;
    transition:transform var(--dur-fast) var(--ease), background var(--dur) var(--ease),
               border-color var(--dur) var(--ease);
  }
  a.site:active { transform:scale(.97); background:var(--surface-2); border-color:var(--accent-dim) }
  a.site .t { font-size:14.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  a.site .u { font-size:11px; color:var(--faint); margin-top:3px;
              overflow:hidden; text-overflow:ellipsis; white-space:nowrap }

  .tools { display:grid; grid-template-columns:1fr 1fr; gap:var(--s-sm) }
  .foot { color:var(--faint); font-size:11px; text-align:center; margin-top:var(--s-xxl); line-height:1.6 }
</style>
</head>
<body>

  <!-- ============ 品牌 + 引擎状态 ============ -->
  <div data-block="home.showBrand">
    <div class="head">
      <div class="brand"><span class="dot"></span><h1>ZedScope</h1></div>
      <a class="btn ghost sm" href="ui-config.html" style="flex:0 0 auto">界面定制</a>
    </div>
    <div class="sub" style="margin-bottom:0">ZedScope · 内置抓包调试的轻量 AI 浏览器 · 浏览为主，一键看网络日志</div>
  </div>

  <div class="status" data-block="home.showStatus">
    <span class="pill on"><i class="led"></i>抓包引擎 <b>随 App 启动</b></span>
    <span class="pill" id="pillTheme">强调色 <b>琥珀</b></span>
    <span class="pill" id="pillSrc">配置 <b>默认</b></span>
  </div>

  <!-- ============ 地址 / 搜索直达 ============ -->
  <form class="omni" id="omni" data-block="home.showSearch" autocomplete="off" action="#">
    <input id="q" type="text" inputmode="url" enterkeyhint="go"
           placeholder="输入网址或搜索内容" aria-label="网址或搜索">
    <button type="submit" aria-label="前往">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h13M13 6l6 6-6 6"/>
      </svg>
    </button>
  </form>

  <!-- ============ 主行动：网络日志 ============ -->
  <div data-block="home.showQuickActions">
    <a class="primary" href="yami://capture">
      <span class="ico">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12h4l2.5-6 3 12 2.5-6H21"/>
        </svg>
      </span>
      <span style="flex:1 1 auto; min-width:0">
        <span class="t">网络日志</span>
        <span class="d">实时请求 / 响应 · Token 自动归集 · 点条目复制详情</span>
      </span>
      <span class="go">›</span>
    </a>

    <!-- 主行动 2：AI 对话 / 办事（新增，跳 AI 面板） -->
    <a class="primary ai" href="yami://ai">
      <span class="ico">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l1.8 4.5L18 9l-4.2 1.5L12 15l-1.8-4.5L6 9l4.2-1.5z"/>
          <path d="M19 14l.9 2.2L22 17l-2.1.8L19 20l-.9-2.2L16 17l2.1-.8z"/>
        </svg>
      </span>
      <span style="flex:1 1 auto; min-width:0">
        <span class="t">AI 对话 / 办事</span>
        <span class="d">直接对话，或让 Agent 替你操作浏览器、抓包、SSH</span>
      </span>
      <span class="go">›</span>
    </a>

    <div class="spacer"></div>

    <div class="tools">
      <a class="btn tonal sm" href="yami://install-ca">安装抓包证书</a>
      <a class="btn ghost sm" href="yami://settings">设置</a>
    </div>
  </div>

  <!-- ============ 证书引导 ============ -->
  <div data-block="home.showCaHint">
    <div class="spacer"></div>
    <div class="hint">
      抓包前请先 <b>安装证书</b>：否则 HTTPS 站点无法被拦截，页面可能打不开、网络日志也会是空的。
    </div>
  </div>

  <!-- ============ 常用入口 ============ -->
  <div data-block="home.showBookmarks">
    <div class="spacer"></div>
    <div class="label"><span>常用入口</span><a class="more" href="ui-config.html">编辑</a></div>
    <div class="grid" id="sites"></div>
  </div>

  <div class="foot">
    仅用于你有权调试的流量<br>
    界面区块与配色可在「界面定制」中调整（ui.json）
  </div>

  <script src="ui-defaults.js"></script>
  <script src="ui-boot.js"></script>
  <script>
  (function () {
    "use strict";
    var cfg = YamiUI.defaults();

    function renderSites() {
      var box = document.getElementById("sites");
      var home = (cfg.blocks && cfg.blocks.home) || {};
      var cols = Math.max(1, Math.min(4, home.bookmarkColumns || 2));
      box.style.setProperty("--cols", cols);
      box.textContent = "";
      (cfg.bookmarks || []).forEach(function (b) {
        if (!b || !b.url) return;
        var a = document.createElement("a");
        a.className = "site";
        a.href = b.url;                              // 交给 WebView 正常加载
        var t = document.createElement("div");
        t.className = "t";
        t.textContent = b.title || b.url;
        var u = document.createElement("div");
        u.className = "u";
        u.textContent = b.url.replace(/^https?:\/\//, "").replace(/\/$/, "");
        a.appendChild(t); a.appendChild(u);
        box.appendChild(a);
      });
    }

    function paintStatus(source) {
      var accent = (cfg.theme && cfg.theme.accent) || "#D9A45B";
      var themePill = document.getElementById("pillTheme");
      themePill.innerHTML = "";
      var led = document.createElement("i");
      led.className = "led";
      led.style.background = accent;
      led.style.boxShadow = "0 0 0 3px " + accent + "4D";
      var txt = document.createElement("span");
      txt.textContent = "强调色";
      var b = document.createElement("b");
      b.textContent = accent.toUpperCase();
      themePill.appendChild(led); themePill.appendChild(txt); themePill.appendChild(b);

      var map = { local: "已自定义", bridge: "ui.json", asset: "ui.json", builtin: "默认" };
      document.getElementById("pillSrc").innerHTML = "";
      var s1 = document.createElement("span"); s1.textContent = "配置";
      var s2 = document.createElement("b"); s2.textContent = map[source] || "默认";
      document.getElementById("pillSrc").appendChild(s1);
      document.getElementById("pillSrc").appendChild(s2);
    }

    document.getElementById("omni").addEventListener("submit", function (e) {
      e.preventDefault();
      var url = YamiUI.resolveInput(document.getElementById("q").value, cfg);
      if (url) window.location.href = url;
    });

    YamiUI.load().then(function (res) {
      cfg = res.config;
      YamiUI.applyTheme(cfg);
      YamiUI.applyBlocks(cfg);
      renderSites();
      paintStatus(res.source);
    });

    // 首屏先用内置默认渲染，避免异步解析造成的空白闪烁
    YamiUI.applyTheme(cfg);
    YamiUI.applyBlocks(cfg);
    renderSites();
    paintStatus("builtin");
  })();
  </script>
</body>
</html>
